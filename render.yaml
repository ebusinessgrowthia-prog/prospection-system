# 🚀 CONFIGURATION RENDER – PROSPECTION AUTOMATIQUE B2B
services:
  - type: web
    name: prospection-automation
    env: python
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "gunicorn main_workflow_complete:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
        value: "AIzaSyBdEadbjoGwtY1r1mKYOFzrsJnMow8eIMo"
      - key: SENDGRID_API_KEY
        sync: false
        value: "uJjC5KAe1JtbXK1fUo95eLkwy8ZgwOOQ"
      - key: ABSTRACT_API_KEY
        sync: false
        value: "7bee4ca548d646688b5eb0d089933d1b"
      - key: HUNTER_API_KEY
        sync: false
        value: "5V917RWY982Z1RNILI5I"
      - key: GOOGLE_SHEETS_CREDENTIALS_FILE
        value: "credentials.json"
      - key: GOOGLE_SHEETS_SPREADSHEET_NAME
        value: "Prospection"
      - key: FROM_EMAIL
        value: "prospection@votredomaine.com"
      - key: FROM_NAME
        value: "Agence Digitale Pro"
      - key: DAILY_EMAIL_LIMIT
        value: "100"
      - key: EMAIL_VALIDATION_THRESHOLD
        value: "0.8"
      - key: UNSUBSCRIBE_LINK
        value: "https://votredomaine.com/unsubscribe"
  - type: cron
    name: daily-optimizer
    env: python
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    schedule: "0 9 * * *"
    startCommand: "python -c 'from main_workflow import ProspectionOrchestrator; o=ProspectionOrchestrator(); o.run_daily_optimization()'"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
envVarGroups:
  - name: prospection-secrets
    envVars:
      - key: GEMINI_API_KEY
        value: "AIzaSyBdEadbjoGwtY1r1mKYOFzrsJnMow8eIMo"
      - key: SENDGRID_API_KEY
        value: "uJjC5KAe1JtbXK1fUo95eLkwy8ZgwOOQ"
      - key: ABSTRACT_API_KEY
        value: "7bee4ca548d646688b5eb0d089933d1b"
      - key: HUNTER_API_KEY
        value: "5V917RWY982Z1RNILI5I"
