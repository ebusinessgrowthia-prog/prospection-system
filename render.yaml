# 🚀 RENDER.YAML - CONFIGURATION COMPLÈTE POUR LE DÉPLOIEMENT AUTOMATIQUE

services:
  # 🎯 SERVICE PRINCIPAL - SYSTÈME DE PROSPECTION COMPLET
  - type: web
    name: prospection-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main_workflow_complete.py
    envVars:
      # 🔑 CLÉS API - À CONFIGURER DANS RENDER
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ABSTRACT_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false
      - key: PORT
        value: 10000
    
    # 📊 CONFIGURATION RESSOURCES
    plan: starter
    region: frankfurt
    
    # 🔄 REDÉMARRAGE AUTOMATIQUE
    autoDeploy: true
    
    # 📈 HEALTH CHECKS
    healthCheckPath: /health
    
    # ⏰ TIMEOUTS
    buildTimeout: 300
    startTimeout: 60

  # 🎯 SERVICE DE BACKUP - LOGS ET MONITORING
  - type: web
    name: prospection-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor.py
    envVars:
      - key: PORT
        value: 10001
    plan: free
    autoDeploy: true

# 📋 CONFIGURATION ENVIRONNEMENT
envVarGroups:
  - name: prospection-secrets
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ABSTRACT_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false

# 🚀 CONFIGURATION DÉPLOIEMENT
previews:
  generation: automatic
  expiration: 7d

# 📊 MONITORING
metrics:
  - name: requests
    type: requests
  - name: response_time
    type: response_time
  - name: cpu
    type: cpu
  - name: memory
    type: memory